<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/Gray.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Bropella.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Instrument+Serif:ital@0;1&family=Pinyon+Script&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <title>DevZ-Go — Showcase Your Code</title>
    <meta name="description" content="A cozy community for student developers to share projects, discover incredible work, and build together." />
    <script>
      (function () {
        var key = "devzgo.assetReload";
        function recover(message) {
          if (!message || (message.indexOf("/assets/") === -1 && message.indexOf("module script") === -1 && message.indexOf("MIME type") === -1 && message.indexOf("dynamically imported module") === -1)) return;
          var last = Number(sessionStorage.getItem(key) || 0);
          var now = Date.now();
          if (now - last < 20000) return;
          sessionStorage.setItem(key, String(now));
          sessionStorage.removeItem("devzgo.chunkReload");
          sessionStorage.removeItem("devzgo.errorReload");
          var url = new URL(location.href);
          url.searchParams.set("v", String(now));
          location.replace(url.toString());
        }
        window.addEventListener("error", function (event) {
          var target = event.target;
          if (target && target.tagName === "SCRIPT") recover(String(target.src || ""));
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          recover(reason && (reason.message || String(reason)) || "");
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
